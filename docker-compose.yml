services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: leftover-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env

  frontend:
    build: ./frontend
    container_name: leftover-frontend
    ports:
      - "5173:4173"
    depends_on:
      - backend
